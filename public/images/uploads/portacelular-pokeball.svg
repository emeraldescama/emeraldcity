    <path d="M -70 90 L 70 90 L 90 130 L -90 130 Z" fill="#047857" opacity="0.8" />
  </g>
  <rect x="30" y="325" width="280" height="45" rx="8" fill="#030712" fill-opacity="0.8" stroke="#10b981" stroke-width="1.5" />
  <text x="45" y="354" fill="#34d399" font-family="Outfit, Inter, sans-serif" font-weight="bold" font-size="16">SOPORTE POKÉBALL GO PLUS+</text>

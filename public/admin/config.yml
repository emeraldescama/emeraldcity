local_backend: true
backend:
  name: github
  repo: JoseZ1701/Emerald-City-Page # Repositorio de GitHub oficial de la comunidad
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: "noticias"
    label: "Noticias y Quedadas"
    folder: "src/content/noticias"
    create: true
    slug: "{{title}}"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: "HH:mm", format: "YYYY-MM-DD" }
      - { label: "Autor", name: "author", widget: "string", default: "Emerald City Team" }
      - { 
          label: "Categoría", 
          name: "category", 
          widget: "select", 
          options: ["Juego", "Quedada"] 
        }
      - { label: "Descripción Breve", name: "description", widget: "string" }
      - { label: "Imagen de Portada", name: "image", widget: "image" }
      - { label: "Cuerpo", name: "body", widget: "markdown" }

  - name: "bazar"
    label: "Bazar Emerald (3D)"
    folder: "src/content/bazar"
    create: true
    slug: "{{name}}"
    format: "json"
    fields:
      - { label: "Nombre", name: "name", widget: "string" }
      - { 
          label: "Categoría", 
          name: "category", 
          widget: "select", 
          options: ["Miniaturas", "Útiles", "Cosplay/Accesorios"] 
        }
      - { label: "Descripción", name: "description", widget: "string" }
      - { label: "Material", name: "material", widget: "string" }
      - { label: "Dimensiones de Referencia", name: "dimensions", widget: "string" }
      - { label: "Imagen", name: "image", widget: "image" }
      - { label: "Disponible", name: "available", widget: "boolean", default: true }
      - { label: "Mensaje de Cotización", name: "quote_message", widget: "string", required: false }

  - name: "gimmi-pass"
    label: "Gimmi Pass"
    folder: "src/content/gimmi-pass"
    create: true
    slug: "{{name}}"
    format: "json"
    fields:
      - { label: "Nombre del Pack", name: "name", widget: "string" }
      - { label: "Descripción", name: "description", widget: "string" }
      - { 
          label: "Items Incluidos", 
          name: "items_included", 
          widget: "list",
          field: { label: "Item", name: "item", widget: "string" }
        }
      - { label: "Precio Referencial en USD", name: "price_ref", widget: "number", value_type: "float" }
      - { label: "Icono o Imagen", name: "image", widget: "image" }
      - { label: "Destacado", name: "featured", widget: "boolean", default: false }

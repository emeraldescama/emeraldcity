# Publica cada día los eventos oficiales de Pokémon GO con las reglas de Emerald City.
# Cada commit nuevo hace que Vercel vuelva a publicar el sitio.
name: Sincronizar eventos

on:
  schedule:
    - cron: '17 10 * * *' # 6:17 AM en Caracas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-eventos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar eventos nuevos
        run: node scripts/sync-eventos.mjs

      - name: Publicar cambios
        run: |
          git add src/content/eventos public/images/eventos
          if git diff --cached --quiet; then
            echo "Sin eventos nuevos."
            exit 0
          fi
          git config user.name "Emerald City Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Eventos automáticos de la semana"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

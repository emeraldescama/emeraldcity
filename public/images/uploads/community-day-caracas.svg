  </defs>
  <rect width="800" height="500" fill="url(#bgCd)" />
  <!-- Caracas Skyline Abstract silhouette -->
  <path d="M 0 420 L 150 420 L 150 340 L 220 340 L 220 420 L 380 420 L 400 200 L 420 420 L 580 420 L 580 320 L 640 320 L 640 420 L 800 420 L 800 500 L 0 500 Z" fill="#021f18" opacity="0.7" />

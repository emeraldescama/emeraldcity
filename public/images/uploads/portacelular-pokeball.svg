<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgP)" />
  <!-- Pokéball Shape -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="100" fill="#1e293b" stroke="#34d399" stroke-width="4" />
    <path d="M -100 0 A 100 100 0 0 1 100 0 Z" fill="#ef4444" opacity="0.9" />
    <path d="M -100 0 A 100 100 0 0 0 100 0 Z" fill="#f8fafc" />
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#0f172a" stroke-width="12" />
    <circle cx="0" cy="0" r="30" fill="#0f172a" />
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#059669" stroke-width="4" />
